name: Test scraping DentalCompare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Diagnostic GACD Common Crawl
        working-directory: backend
        run: python diagnostic_gacd_cdx.py
