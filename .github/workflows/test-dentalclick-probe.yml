name: Test Dentalclick public probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/snapshot/dentalclick_probe.py'
      - '.github/workflows/test-dentalclick-probe.yml'

permissions:
  contents: read

jobs:
  probe-dentalclick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Probe Dentalclick
        run: python backend/snapshot/dentalclick_probe.py
