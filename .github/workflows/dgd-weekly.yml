name: Dental Good Deal weekly catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
  push:
    paths:
      - 'backend/snapshot/dental_good_deal_catalog.py'
      - '.github/workflows/dgd-weekly.yml'

permissions:
  contents: write

concurrency:
  group: dgd-weekly-catalogue
  cancel-in-progress: false

jobs:
  refresh-dgd:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt

      - name: Recuperer un lot Dental Good Deal
        id: collect
        continue-on-error: true
        run: |
          python backend/snapshot/dental_good_deal_catalog.py \
            --workers 6 \
            --discover-workers 4 \
            --max-pages 220 \
            --chunk-size 400 \
            --output backend/snapshot/data/dental_good_deal_catalog.json \
            --urls-out backend/snapshot/data/dgd_product_urls.json \
            --state backend/snapshot/data/dgd_progress.json

      - name: Controle etat du catalogue
        run: |
          python - <<'PY'
          import json
          p='backend/snapshot/data/dental_good_deal_catalog.json'
          d=json.load(open(p,encoding='utf-8'))
          print('Familles découvertes:',d.get('product_pages_discovered'))
          print('Familles terminées:',d.get('product_pages_completed'))
          print('Références cumulées:',d.get('total_products'))
          print('Catalogue complet:',d.get('catalogue_complete'))
          PY

      - name: Sauvegarder progression et catalogue
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add backend/snapshot/data/dental_good_deal_catalog.json backend/snapshot/data/dgd_product_urls.json backend/snapshot/data/dgd_progress.json
          git diff --cached --quiet || git commit -m 'Advance Dental Good Deal catalogue'
          git pull --rebase
          git push

      - name: Signaler protection eventuelle
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'La progression a été sauvegardée avant arrêt. Le prochain run reprendra le catalogue.'
