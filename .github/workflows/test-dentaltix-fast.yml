name: Dentaltix weekly catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * 1'
  push:
    paths:
      - 'backend/snapshot/dentaltix_catalog.py'
      - '.github/workflows/test-dentaltix-fast.yml'

permissions:
  contents: write

concurrency:
  group: dentaltix-weekly-catalogue
  cancel-in-progress: false

jobs:
  refresh-dentaltix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt

      - name: Avancer le catalogue Dentaltix
        id: collect
        continue-on-error: true
        run: |
          python backend/snapshot/dentaltix_catalog.py \
            --workers 5 \
            --discover-workers 3 \
            --max-pages 500 \
            --discover-chunk 60 \
            --product-chunk 300 \
            --output backend/snapshot/data/dentaltix_catalog.json \
            --urls-out backend/snapshot/data/dentaltix_product_urls.json \
            --discovery-state backend/snapshot/data/dentaltix_discovery_progress.json \
            --progress-state backend/snapshot/data/dentaltix_progress.json

      - name: Controle etat du catalogue
        run: |
          python - <<'PY'
          import json
          d=json.load(open('backend/snapshot/data/dentaltix_catalog.json',encoding='utf-8'))
          print('URLs découvertes:',d.get('product_pages_discovered'))
          print('URLs traitées:',d.get('product_pages_completed'))
          print('Références cumulées:',d.get('total_products'))
          print('Découverte complète:',d.get('discovery_complete'))
          print('Catalogue complet:',d.get('catalogue_complete'))
          PY

      - name: Sauvegarder progression et catalogue
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add backend/snapshot/data/dentaltix_catalog.json backend/snapshot/data/dentaltix_product_urls.json backend/snapshot/data/dentaltix_discovery_progress.json backend/snapshot/data/dentaltix_progress.json
          git diff --cached --quiet || git commit -m 'Advance Dentaltix catalogue'
          git pull --rebase
          git push

      - name: Signaler protection eventuelle
        if: steps.collect.outcome == 'failure'
        run: echo 'Progression sauvegardée. Le prochain run reprendra sans perdre le catalogue.'
