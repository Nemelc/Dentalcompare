name: Test Mega weekly refresh

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/snapshot/mega_weekly_refresh.py'
      - '.github/workflows/test-mega-weekly-refresh.yml'

permissions:
  contents: read

jobs:
  test-mega-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Tester 40 URLs Mega connues
        run: python backend/snapshot/mega_weekly_refresh.py --limit 40 --workers 6 --output /tmp/mega_refresh_probe.json
      - name: Résumé
        if: always()
        run: |
          if [ -f /tmp/mega_refresh_probe.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('/tmp/mega_refresh_probe.json'))
          print('Demandées:',d['requested'])
          print('Succès:',d['success'])
          print('Avec prix:',d['with_price'])
          print('Avec disponibilité:',d['with_availability'])
          print('Erreurs:',len(d['errors']))
          PY
          fi
