<style>

  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  header.top{
    position:relative; overflow:hidden;
    background:var(--teal); border-bottom:3px solid #D4530A;

    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  header.top::before{
    content:""; position:absolute; top:-70px; right:8%;
    width:260px; height:260px; background:var(--teal);
    filter:blur(80px); opacity:0.45; border-radius:50%; pointer-events:none;
  }
  .brand{ position:relative; z-index:1; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.01em;
    display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .brand .mark{ width:30px;height:30px; background:#fff; border:1.5px solid #fff; color:var(--teal); border-radius:8px;
    display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .brand .mark svg{ width:18px; height:18px; }
  .tagline{ position:relative; z-index:1; font-family:'IBM Plex Sans', sans-serif; font-style:italic; font-size:12px; color:#F3D9C4;
    padding-left:14px; margin-left:2px; border-left:1px solid rgba(255,255,255,0.3); display:none; }
  @media (min-width:900px){ .tagline{ display:inline-block; } }
  .brand small{ display:block; font-family:'IBM Plex Sans', sans-serif; font-weight:400; font-size:10.5px; color:#C9B8A4; }
  .top-note{ position:relative; z-index:1; font-size:11.5px; color:#C9B8A4; font-family:'IBM Plex Mono', monospace; }
  .cart-link{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    color:#F6F7F6;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    background:#3A2E22;
    padding:8px 14px;
    border-radius:20px;
  }
  .cart-link:hover{ background:#4A3B2C; }
  .cart-badge{
    display:none;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    padding:0 4px;
    background:var(--teal);
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    border-radius:10px;
  }

  .layout{ display:flex; align-items:flex-start; width:100%; }
  .sidebar{ background:var(--card); border-right:1px solid var(--line); padding:20px 12px; width:220px; flex-shrink:0; }
  .sidebar-label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); padding:0 12px 10px 12px; }
  .sidebar a{ display:block; padding:11px 12px; font-family:'IBM Plex Sans', sans-serif; font-size:14px; color:var(--ink-soft); text-decoration:none; border-radius:6px; border-left:3px solid transparent; margin-bottom:2px; }
  .sidebar a:hover{ background:var(--bg); color:var(--ink); }
  .sidebar a.active{ color:var(--teal); background:var(--teal-soft); border-left:3px solid var(--teal); font-weight:600; }

  main{ flex:1; min-width:0; padding:32px; max-width:820px; }
  .breadcrumb{ font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }
  .breadcrumb a{ color:var(--teal); text-decoration:none; }
  .breadcrumb a:hover{ text-decoration:underline; }

  .prod-photo{
    width:100%;
    height:220px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:64px;
    margin-bottom:20px;
  }
  .tag{ display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.04em; text-transform:uppercase;
    background:var(--teal-soft); color:var(--teal); padding:3px 8px; border-radius:4px; margin-bottom:10px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:26px; margin:0 0 6px 0; letter-spacing:-0.01em; line-height:1.25; }
  .subline{ font-size:14px; color:var(--ink-soft); margin-bottom:24px; }

  .desc-block{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:24px;
  }
  .desc-block .label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:10px; }
  .desc-block p{ font-size:14.5px; line-height:1.65; color:var(--ink); margin:0 0 10px 0; }
  .desc-block p:last-child{ margin-bottom:0; }
  .desc-sources{ font-size:11.5px; color:var(--steel); margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }

  .compare-block{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:24px; }
  .compare-block .label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:14px; }
  .rank-row{ display:grid; grid-template-columns:24px 140px 1fr 100px; align-items:center; gap:10px; margin-bottom:12px; }
  .rank-row .num{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--steel); }
  .rank-row.best .num{ color:var(--teal); font-weight:700; }
  .rank-row .merch{ font-size:14px; color:var(--ink-soft); }
  .rank-row.best .merch{ color:var(--ink); font-weight:600; }
  .rank-bar-track{ height:10px; background:var(--bg); border-radius:5px; overflow:hidden; }
  .rank-bar-fill{ height:100%; background:var(--steel); border-radius:5px; }
  .rank-row.best .rank-bar-fill{ background:var(--teal); }
  .rank-row .price{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    text-align:right;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:flex-end;
    gap:8px;
  }
  .rank-row .vs-median{
    font-size:11px;
    color:var(--mauve);
    font-weight:600;
  }
  .rank-row.best .vs-median{ color:var(--teal); }
  .median-note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .median-note strong{ color:var(--teal); }
  .rank-row.best .price{ color:var(--teal); font-weight:700; }

  .cta-btn{ flex:1; background:var(--teal); color:#fff; border:none; padding:14px; border-radius:8px;

  .cta-note{ font-size:11.5px; color:var(--ink-soft); max-width:130px; line-height:1.35; }
  .add-cart-btn{
    width:100%;
    margin-top:10px;
    background:none;
    border:1px solid var(--teal);
    color:var(--teal);
    padding:11px 14px;
    border-radius:8px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .add-cart-btn:hover{ background:var(--teal-soft); }
  .add-cart-btn.added{ background:var(--teal); color:#fff; border-color:var(--teal); }

  .not-found a{ color:var(--teal); font-weight:600; }

  footer{ background:var(--card); border-top:1px solid var(--line); padding:20px 32px; font-size:12px; color:var(--ink-soft); text-align:center; }

</style>

function slugify(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

// Icône générique par catégorie — remplacée par la vraie photo produit une fois les flux fournisseurs branchés
const CATEGORY_ICONS = {
  "usage-unique": "🧤",
  "anesthesie": "💉",
  "empreintes": "🦷",
  "rotatifs": "⚙️",
  "endodontie": "🩹",
  "hygiene": "🧴"
};

// Génère une description "synthèse" automatiquement à partir des infos déjà connues du produit.
// Quand on aura les vraies descriptions des 3 sites, on pourra les remplacer ici sans toucher au reste de la page.
function synthesizeDescription(p, catTitle){
  const merchantNames = p.prices.map(x => x.merchant).join(', ');
  return [
    `${p.name} — ${p.sub}. Référence de la catégorie « ${catTitle} », suivie chez ${p.prices.length} fournisseurs professionnels : ${merchantNames}.`,
    `Cette synthèse rassemble les informations disponibles chez chaque marchand pour cette référence : conditionnement, usage prévu et prix pratiqués. Elle vous évite d'ouvrir chaque site un par un pour vérifier qu'il s'agit bien du même produit.`,
    `À l'usage, cette référence correspond à un consommable couramment commandé en cabinet dentaire dans la catégorie ${catTitle.toLowerCase()}. Vérifiez toujours la fiche technique complète sur le site du marchand avant commande (lot, date de péremption, certification CE).`
  ];
}

function findProductById(id){
  for(const catKey in CATEGORIES){
    const cat = CATEGORIES[catKey];
    const found = cat.products.find(p => slugify(p.name) === id);
    if(found) return { product: found, catKey, catTitle: cat.title };
  }
  return null;
}

function renderProduct(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const result = id ? findProductById(id) : null;
  const main = document.getElementById('main-content');

  if(!result){
    main.innerHTML = `
      <div class="not-found">
        <p>Produit introuvable.</p>
        <a href="index.html">← Retour à l'accueil</a>
      </div>
    `;
    return;
  }

  const { product: p, catKey, catTitle } = result;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.cat === catKey));
  document.title = p.name + " — DentalCompare";

  const sorted = [...p.prices].sort((a,b)=>a.value-b.value);
  const min = sorted[0].value;
  const mid = Math.floor(sorted.length / 2);
  const median = sorted.length % 2 === 0
    ? (sorted[mid - 1].value + sorted[mid].value) / 2
    : sorted[mid].value;
  const bestSavingsPct = Math.round(((median - min) / median) * 100);
  const top3 = sorted.slice(0, 3);

  const rows = top3.map((pr, i) => {
    const isBest = i === 0;
    const barPct = (pr.value / median) * 100;
    const vsMedianPct = Math.round(((median - pr.value) / median) * 100);
    return `
      <div class="rank-row ${isBest ? 'best' : ''}">
        <span class="num">${i+1}</span>
        <span class="merch">${pr.merchant}</span>
        <span class="rank-bar-track"><span class="rank-bar-fill" style="width:${Math.min(barPct,100)}%;"></span></span>
        <span class="price">${pr.value.toFixed(2)} €<span class="vs-median">${vsMedianPct > 0 ? '-'+vsMedianPct+'%' : '='}</span></span>
      </div>
    `;
  }).join('');

  const descParagraphs = synthesizeDescription(p, catTitle).map(t => `<p>${t}</p>`).join('');

  main.innerHTML = `
    <div class="breadcrumb">
      <a href="index.html">Accueil</a> → <a href="dental-comparator.html?cat=${catKey}">${catTitle}</a> → ${p.name}
    </div>

    <span class="tag">${p.tag}</span>
    <h1>${p.name}</h1>
    <div class="subline">${p.sub}</div>

    <div class="prod-photo">${CATEGORY_ICONS[catKey] || '🦷'}</div>

    <div class="desc-block">
      <div class="label">Description synthétisée — ${p.prices.length} sources</div>
      ${descParagraphs}
      <div class="desc-sources">Générée automatiquement à partir des fiches de ${p.prices.map(x=>x.merchant).join(', ')}.</div>
    </div>

    <div class="compare-block">
      <div class="label">Top 3 des prix les plus bas — sur ${p.prices.length} marchands comparés</div>
      ${rows}
      <div class="median-note">-${bestSavingsPct}% par rapport au prix médian du marché</div>
      <div class="cta-row">
        <button class="cta-btn" onclick="reveal(this)">Voir la meilleure offre — ${min.toFixed(2)} € &nbsp;→</button>
        <div class="cta-note">Redirige vers le marchand le moins cher</div>
      </div>
      <button class="add-cart-btn" onclick='addProductToCart(this)' data-product='${JSON.stringify({id: id, name: p.name, tag: p.tag, sub: p.sub, prices: p.prices}).replace(/'/g, "&#39;")}'>
        + Ajouter au panier
      </button>
    </div>
  `;
}

function reveal(btn){
  btn.textContent = "Redirection vers le marchand…";
  btn.style.background = "#57655F";
}

function addProductToCart(btn){
  const product = JSON.parse(btn.dataset.product);
  addToCart(product);
  const original = btn.textContent;
  btn.textContent = "✓ Ajouté au panier";
  btn.classList.add('added');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('added');
  }, 1400);
}

renderProduct();
</script>
