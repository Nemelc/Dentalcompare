    display:flex;align-items:center;justify-content:center; font-size:12px; font-family:'IBM Plex Mono', monospace; }
  .brand small{ display:block; font-family:'IBM Plex Sans', sans-serif; font-weight:400; font-size:10.5px; color:#B9C4BF; }
  .top-note{ font-size:11.5px; color:#B9C4BF; font-family:'IBM Plex Mono', monospace; }

  .layout{ display:flex; align-items:flex-start; max-width:1400px; margin:0 auto; }
  .sidebar{ background:var(--card); border-right:1px solid var(--line); padding:20px 12px; width:220px; flex-shrink:0; }
  .sidebar-label{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); padding:0 12px 10px 12px; }
  .sidebar a{ display:block; padding:11px 12px; font-family:'IBM Plex Sans', sans-serif; font-size:14px; color:var(--ink-soft); text-decoration:none; border-radius:6px; border-left:3px solid transparent; margin-bottom:2px; }
  .sidebar a:hover{ background:var(--bg); color:var(--ink); }
  .sidebar a.active{ color:var(--teal); background:var(--teal-soft); border-left:3px solid var(--teal); font-weight:600; }

  .subline{ font-size:14px; color:var(--ink-soft); margin-bottom:24px; }

  .rank-row{ display:grid; grid-template-columns:24px 150px 1fr 90px; align-items:center; gap:12px; margin-bottom:12px; }

function slugify(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

// Icône générique par catégorie — remplacée par la vraie photo produit une fois les flux fournisseurs branchés
const CATEGORY_ICONS = {
  "usage-unique": "🧤",
  "anesthesie": "💉",
  "empreintes": "🦷",
  "rotatifs": "⚙️",
  "endodontie": "🩹",
  "hygiene": "🧴"
};

// Génère une description "synthèse" automatiquement à partir des infos déjà connues du produit.
// Quand on aura les vraies descriptions des 3 sites, on pourra les remplacer ici sans toucher au reste de la page.
function synthesizeDescription(p, catTitle){
  const merchantNames = p.prices.map(x => x.merchant).join(', ');
  return [
    `${p.name} — ${p.sub}. Référence de la catégorie « ${catTitle} », suivie chez ${p.prices.length} fournisseurs professionnels : ${merchantNames}.`,
    `Cette synthèse rassemble les informations disponibles chez chaque marchand pour cette référence : conditionnement, usage prévu et prix pratiqués. Elle vous évite d'ouvrir chaque site un par un pour vérifier qu'il s'agit bien du même produit.`,
    `À l'usage, cette référence correspond à un consommable couramment commandé en cabinet dentaire dans la catégorie ${catTitle.toLowerCase()}. Vérifiez toujours la fiche technique complète sur le site du marchand avant commande (lot, date de péremption, certification CE).`
  ];
}

function findProductById(id){
  for(const catKey in CATEGORIES){
    const cat = CATEGORIES[catKey];
    const found = cat.products.find(p => slugify(p.name) === id);
    if(found) return { product: found, catKey, catTitle: cat.title };
  }
  return null;
}

function renderProduct(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const result = id ? findProductById(id) : null;
  const main = document.getElementById('main-content');

  if(!result){
    main.innerHTML = `
      <div class="not-found">
        <p>Produit introuvable.</p>
        <a href="index.html">← Retour à l'accueil</a>
      </div>
    `;
    return;
  }

  const { product: p, catKey, catTitle } = result;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.cat === catKey));
  document.title = p.name + " — Dentaire Comparatif";

  const sorted = [...p.prices].sort((a,b)=>a.value-b.value);
  const min = sorted[0].value;
  const max = sorted[sorted.length-1].value;

  const rows = sorted.map((pr, i) => {
    const isBest = i === 0;
    const barPct = (pr.value / max) * 100;
    return `
      <div class="rank-row ${isBest ? 'best' : ''}">
        <span class="num">${i+1}</span>
        <span class="merch">${pr.merchant}</span>
        <span class="rank-bar-track"><span class="rank-bar-fill" style="width:${barPct}%;"></span></span>
        <span class="price">${pr.value.toFixed(2)} €</span>
      </div>
    `;
  }).join('');

  const descParagraphs = synthesizeDescription(p, catTitle).map(t => `<p>${t}</p>`).join('');

  main.innerHTML = `
    <div class="breadcrumb">
      <a href="index.html">Accueil</a> → <a href="dental-comparator.html?cat=${catKey}">${catTitle}</a> → ${p.name}
    </div>

    <span class="tag">${p.tag}</span>
    <h1>${p.name}</h1>
    <div class="subline">${p.sub}</div>

    <div class="prod-photo">${CATEGORY_ICONS[catKey] || '🦷'}</div>

    <div class="desc-block">
      <div class="label">Description synthétisée — ${p.prices.length} sources</div>
      ${descParagraphs}
      <div class="desc-sources">Générée automatiquement à partir des fiches de ${p.prices.map(x=>x.merchant).join(', ')}.</div>
    </div>

    <div class="compare-block">
      <div class="label">Comparatif des ${p.prices.length} marchands</div>
      ${rows}
      <div class="cta-row">
        <button class="cta-btn" onclick="reveal(this)">Voir la meilleure offre — ${min.toFixed(2)} € &nbsp;→</button>
        <div class="cta-note">Redirige vers le marchand le moins cher</div>
      </div>
    </div>

    <p class="disclosure">
      <strong>Information :</strong> ce site contient des liens affiliés. Lorsque vous cliquez sur « Voir l'offre » et effectuez un achat, nous pouvons percevoir une commission, sans surcoût pour vous.
    </p>
  `;
}

function reveal(btn){
  btn.textContent = "Redirection vers le marchand…";
  btn.style.background = "#57655F";
}

renderProduct();
</script>

</body>
</html>
