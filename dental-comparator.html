<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DentaCompare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6F2;
    --card: #FFFFFF;
    --ink: #2B2119;
    --ink-soft: #6E5E4F;
    --line: #EAE1D6;
    --teal: #F4600C;
    --teal-soft: #FCDCC0;
    --mauve: #1B7A93;
    --mauve-soft: #D9EDF2;
    --steel: #9C8975;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  header.top{
    position:relative;
    overflow:hidden;
    background:#211811;
    border-bottom:3px solid var(--teal);
    color:#F6F7F6;
    padding:18px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header.top::before{
    content:"";
    position:absolute;
    top:-70px; right:8%;
    width:260px; height:260px;
    background:var(--teal);
    filter:blur(80px);
    opacity:0.45;
    border-radius:50%;
    pointer-events:none;
  }
  .brand{
    position:relative;
    z-index:1;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .mark{
    width:32px;height:32px;
    background:rgba(255,255,255,0.12);
    border:1.5px solid rgba(255,255,255,0.4);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand .mark svg{ width:19px; height:19px; }
  .tagline{
    font-family:'IBM Plex Sans', sans-serif;
    font-style:italic;
    font-size:12.5px;
    color:#F3D9C4;
    padding-left:14px;
    margin-left:4px;
    border-left:1px solid rgba(255,255,255,0.3);
    display:none;
  }
  @media (min-width:760px){ .tagline{ display:inline-block; } }
  .brand small{
    display:block;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:400;
    font-size:11px;
    color:#C9B8A4;
    letter-spacing:0.02em;
  }
  .top-note{
    font-size:12px;
    color:#C9B8A4;
    font-family:'IBM Plex Mono', monospace;
  }
  .search-wrap{
    position:relative;
    flex:1;
    max-width:420px;
    z-index:1;
  }
  .search-bar{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:20px;
    padding:9px 14px;
  }
  .search-bar svg{ flex-shrink:0; opacity:0.75; }
  .search-bar input{
    background:none;
    border:none;
    outline:none;
    color:#fff;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    flex:1;
    min-width:0;
  }
  .search-bar input::placeholder{ color:#D9C7B4; }
  .search-results{
    display:none;
    position:absolute;
    top:calc(100% + 6px);
    left:0; right:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.15);
    max-height:340px;
    overflow-y:auto;
    z-index:50;
  }
  .search-results.open{ display:block; }
  .search-result-item{
    display:block;
    padding:10px 14px;
    text-decoration:none;
    color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover{ background:var(--teal-soft); }
  .search-result-item .srname{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    font-weight:600;
  }
  .search-result-item .srmeta{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .search-empty{
    padding:14px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }
  .cart-link{
    position:relative;
    display:flex;
    align-items:center;
    gap:6px;
    color:#F6F7F6;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    background:#3A2E22;
    padding:8px 14px;
    border-radius:20px;
  }
  .cart-link:hover{ background:#4A3B2C; }
  .cart-badge{
    display:none;
    align-items:center;
    justify-content:center;
    min-width:18px;
    height:18px;
    padding:0 4px;
    background:var(--teal);
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    border-radius:10px;
  }
  .subnav{
    background:var(--card);
    border-right:1px solid var(--line);
    padding:20px 12px;
    display:flex;
    flex-direction:column;
    gap:2px;
    width:220px;
    flex-shrink:0;
  }
  .subnav-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    padding:0 12px 10px 12px;
  }
  .subnav button{
    border:none;
    background:none;
    text-align:left;
    padding:11px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    border-radius:6px;
    border-left:3px solid transparent;
  }
  .subnav button:hover{
    background:var(--bg);
  }
  .subnav button.active{
    color:var(--teal);
    background:var(--teal-soft);
    border-left:3px solid var(--teal);
    font-weight:600;
  }
  .layout{
    display:flex;
    align-items:flex-start;
    max-width:1400px;
    margin:0 auto;
  }
  main{
    flex:1;
    min-width:0;
    padding:32px;
  }
  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:24px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:28px;
    margin:0 0 4px 0;
    letter-spacing:-0.01em;
  }
  .page-head p{
    margin:0;
    color:var(--ink-soft);
    font-size:14px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .toolbar label{
    font-size:12px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  select{
    font-family:'IBM Plex Sans', sans-serif;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--card);
    font-size:13px;
    color:var(--ink);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .prod-photo{
    width:100%;
    height:120px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--steel);
    margin-bottom:12px;
  }
  .card-top{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .price-hero{
    text-align:center;
    padding:14px 0 12px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .price-hero .from{
    font-size:10px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-family:'IBM Plex Mono', monospace;
  }
  .price-hero .amount{
    font-family:'Space Grotesk', sans-serif;
    font-size:36px;
    font-weight:700;
    color:var(--teal);
    line-height:1.15;
  }
  .price-hero .pct-pill{
    display:block;
    max-width:200px;
    margin:6px auto 0 auto;
    background:var(--mauve-soft);
    color:var(--mauve);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    font-weight:600;
    padding:5px 10px;
    border-radius:12px;
    line-height:1.4;
    white-space:normal;
  }
  .tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--teal-soft);
    color:var(--teal);
    padding:3px 8px;
    border-radius:4px;
    margin-bottom:8px;
  }
  .prod-name{
    font-family:'Space Grotesk', sans-serif;
    font-size:17px;
    font-weight:600;
    line-height:1.25;
    margin:0;
  }
  .prod-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .desc-link{
    display:inline-block;
    margin-top:8px;
    font-size:12px;
    color:var(--teal);
    text-decoration:none;
    font-weight:600;
  }
  .desc-link:hover{ text-decoration:underline; }
  .price-block{
    text-align:right;
    flex-shrink:0;
  }
  .price-block .from{
    font-size:10px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-family:'IBM Plex Mono', monospace;
  }
  .price-block .amount{
    font-family:'Space Grotesk', sans-serif;
    font-size:30px;
    font-weight:700;
    color:var(--teal);
    line-height:1.1;
    white-space:nowrap;
  }
  .price-block .pct-pill{
    display:inline-block;
    margin-top:4px;
    background:var(--mauve-soft);
    color:var(--mauve);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
  }

  /* Vertical ranked list — signature element, v2 */
  .rank-label{
    font-size:9.5px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-family:'IBM Plex Mono', monospace;
    margin-bottom:8px;
  }
  .rank-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .rank-row{
    display:grid;
    grid-template-columns:20px 78px 1fr 92px;
    align-items:center;
    gap:8px;
  }
  .rank-row .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--steel);
  }
  .rank-row.best .num{
    color:var(--teal);
    font-weight:700;
  }
  .rank-row .merch{
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rank-row.best .merch{
    color:var(--ink);
    font-weight:600;
  }
  .rank-bar-track{
    position:relative;
    height:8px;
    background:var(--bg);
    border-radius:4px;
    overflow:hidden;
  }
  .rank-bar-fill{
    height:100%;
    background:var(--steel);
    border-radius:4px;
  }
  .rank-row.best .rank-bar-fill{
    background:var(--teal);
  }
  .rank-row .price{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    text-align:right;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:flex-end;
    gap:6px;
  }
  .rank-row .vs-median{
    font-size:10px;
    color:var(--mauve);
    font-weight:600;
  }
  .rank-row.best .vs-median{ color:var(--teal); }
  .rank-row.best .price{
    color:var(--teal);
    font-weight:700;
  }

  .cta-row{
    display:flex;
    gap:8px;
    align-items:center;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .cta-btn{
    flex:1;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:11px 14px;
    border-radius:7px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:background 0.15s ease;
  }
  .cta-btn:hover{ background:#18564D; }
  .cta-note{
    font-size:10.5px;
    color:var(--ink-soft);
    max-width:110px;
    line-height:1.3;
  }
  .add-cart-btn{
    width:100%;
    margin-top:8px;
    background:none;
    border:1px solid var(--teal);
    color:var(--teal);
    padding:9px 14px;
    border-radius:7px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .add-cart-btn:hover{ background:var(--teal-soft); }
  .add-cart-btn.added{
    background:var(--teal);
    color:#fff;
    border-color:var(--teal);
  }

  .disclosure{
    max-width:1180px;
    margin:8px auto 40px auto;
    padding:0 32px;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .disclosure strong{ color:var(--ink); }

  footer{
    background:var(--card);
    border-top:1px solid var(--line);
    padding:20px 32px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width:480px){
    .layout{ flex-direction:column; }
    .subnav{
      width:100%;
      flex-direction:row;
      overflow-x:auto;
      border-right:none;
      border-bottom:1px solid var(--line);
      padding:12px;
    }
    .subnav-label{ display:none; }
    .subnav button{
      white-space:nowrap;
      border-left:none;
      border-bottom:3px solid transparent;
    }
    .subnav button.active{
      border-left:none;
      border-bottom:3px solid var(--teal);
    }
  }
  @media (max-width:600px){
    header.top, main, .disclosure{ padding-left:18px; padding-right:18px; }
    h1{ font-size:22px; }
  }
</style>
</head>

    <a href="index.html" style="color:inherit; text-decoration:none; display:flex; align-items:center; gap:10px;">

</header>

<div class="layout">
<nav class="subnav">

  <button class="active" data-cat="usage-unique" onclick="switchCategory('usage-unique')">Usage unique</button>
  <button data-cat="anesthesie" onclick="switchCategory('anesthesie')">Anesthésie</button>
  <button data-cat="empreintes" onclick="switchCategory('empreintes')">Empreintes</button>
  <button data-cat="rotatifs" onclick="switchCategory('rotatifs')">Instruments rotatifs</button>
  <button data-cat="endodontie" onclick="switchCategory('endodontie')">Endodontie</button>
  <button data-cat="hygiene" onclick="switchCategory('hygiene')">Hygiène &amp; stérilisation</button>
</nav>

<main>
  <div class="page-head">
    <div>
      <h1 id="page-title">Usage unique</h1>
      <p id="page-sub">Gants, compresses, aiguilles — comparés sur Dental Good Deal, Dentaltix et GACD</p>
    </div>
    <div class="toolbar">
      <label for="sort">Trier</label>
      <select id="sort" onchange="sortCards(this.value)">
        <option value="default">Pertinence</option>
        <option value="price-asc">Prix le plus bas</option>
        <option value="savings">Économie la plus forte</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</main>
</div>

<footer>
  &nbsp;·&nbsp; <a href="mentions-legales.html" style="color:inherit;">Mentions légales</a>
  &nbsp;·&nbsp; <a href="cgu.html" style="color:inherit;">CGU</a>
</footer>

<script src="cart.js"></script>

// Génère un identifiant unique automatiquement à partir du nom du produit — aucune saisie manuelle nécessaire
function slugify(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
}

// Recherche fonctionnelle dans le bandeau — interroge les 6 catégories en direct
function handleSearch(e){
  if(e.key === 'Escape'){ closeSearch(); e.target.blur(); return; }

  const query = e.target.value.trim().toLowerCase();
  const panel = document.getElementById('search-results');

  if(query.length < 2){
    panel.classList.remove('open');
    panel.innerHTML = '';
    return;
  }

  // Rassemble tous les produits de toutes les catégories en une seule liste cherchable
  const allResults = [];
  for(const catKey in CATEGORIES){
    CATEGORIES[catKey].products.forEach(p => {
      const haystack = (p.name + ' ' + p.tag + ' ' + p.sub).toLowerCase();
      if(haystack.includes(query)){
        allResults.push({ product: p, catKey, catTitle: CATEGORIES[catKey].title });
      }
    });
  }

  if(e.key === 'Enter' && allResults.length > 0){
    window.location.href = 'produit.html?id=' + slugify(allResults[0].product.name);
    return;
  }

  if(allResults.length === 0){
    panel.innerHTML = '<div class="search-empty">Aucun résultat pour « ' + e.target.value + ' »</div>';
    panel.classList.add('open');
    return;
  }

  panel.innerHTML = allResults.slice(0, 8).map(r => {
    const min = Math.min(...r.product.prices.map(x => x.value));
    return `
      <a class="search-result-item" href="produit.html?id=${slugify(r.product.name)}">
        <div class="srname">${r.product.name}</div>
        <div class="srmeta">${r.catTitle} · à partir de ${min.toFixed(2)} €</div>
      </a>
    `;
  }).join('');
  panel.classList.add('open');
}

function closeSearch(){
  const panel = document.getElementById('search-results');
  panel.classList.remove('open');
}

// Petit délai avant fermeture pour laisser le temps au clic sur un résultat de s'enregistrer
function closeSearchSoon(){
  setTimeout(closeSearch, 150);
}

// Icône générique par catégorie — sera remplacée par la vraie photo produit une fois les flux fournisseurs branchés
const CATEGORY_ICONS = {
  "usage-unique": "🧤",
  "anesthesie": "💉",
  "empreintes": "🦷",
  "rotatifs": "⚙️",
  "endodontie": "🩹",
  "hygiene": "🧴"
};

function renderCard(p){
  const sorted = [...p.prices].sort((a,b)=>a.value-b.value);
  const min = sorted[0].value;
  // Médiane calculée sur l'ensemble des marchands comparés (5), pas seulement sur le top 3 affiché
  const mid = Math.floor(sorted.length / 2);
  const median = sorted.length % 2 === 0
    ? (sorted[mid - 1].value + sorted[mid].value) / 2
    : sorted[mid].value;
  const bestSavingsPct = Math.round(((median - min) / median) * 100);
  const top3 = sorted.slice(0, 3);
  const productId = slugify(p.name);

  const rows = top3.map((pr, i) => {
    const isBest = i === 0;
    const barPct = (pr.value / median) * 100;
    const vsMedianPct = Math.round(((median - pr.value) / median) * 100);
    return `
      <div class="rank-row ${isBest ? 'best' : ''}">
        <span class="num">${i+1}</span>
        <span class="merch">${pr.merchant}</span>
        <span class="rank-bar-track"><span class="rank-bar-fill" style="width:${Math.min(barPct,100)}%;"></span></span>
        <span class="price">${pr.value.toFixed(2)} €<span class="vs-median">${vsMedianPct > 0 ? '-'+vsMedianPct+'%' : '='}</span></span>
      </div>
    `;
  }).join('');

  return `
    <div class="card">
      <div class="card-top">
        <div class="prod-photo" style="font-size:36px;">${CATEGORY_ICONS[currentCategory] || '🦷'}</div>
        <span class="tag">${p.tag}</span>
        <p class="prod-name">${p.name}</p>
        <div class="prod-sub">${p.sub}</div>
        <a class="desc-link" href="produit.html?id=${productId}">Description du produit →</a>
      </div>

      <div class="price-hero">
        <div class="from">À partir de</div>
        <div class="amount">${min.toFixed(2)} €</div>
        <span class="pct-pill">-${bestSavingsPct}% par rapport au prix médian du marché</span>
      </div>

      <div>
        <div class="rank-label">Top 3 des prix les plus bas — sur ${p.prices.length} marchands comparés</div>
        <div class="rank-list">${rows}</div>
      </div>

      <div class="cta-row">
        <button class="cta-btn" onclick="reveal(this)">Voir l'offre &nbsp;→</button>
        <div class="cta-note">Redirige vers le marchand le moins cher</div>
      </div>
      <button class="add-cart-btn" onclick='addProductToCart(this)' data-product='${JSON.stringify({id: productId, name: p.name, tag: p.tag, sub: p.sub, prices: p.prices}).replace(/'/g, "&#39;")}'>
        + Ajouter au panier
      </button>
    </div>
  `;
}

function reveal(btn){
  btn.textContent = "Redirection vers le marchand…";
  btn.style.background = "#57655F";
}

// Ajoute un produit au panier depuis le bouton "+ Ajouter au panier" (données stockées dans data-product)
function addProductToCart(btn){
  const product = JSON.parse(btn.dataset.product);
  addToCart(product);
  const original = btn.textContent;
  btn.textContent = "✓ Ajouté au panier";
  btn.classList.add('added');
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove('added');
  }, 1400);
}

function draw(list){
  if(list.length === 0){
    document.getElementById('grid').innerHTML = `
      <div class="empty-state">
        Cette catégorie n'a pas encore de produits d'exemple — on la construira ensemble à une prochaine étape.
      </div>`;
    return;
  }
  document.getElementById('grid').innerHTML = list.map(renderCard).join('');
}

function switchCategory(key){
  currentCategory = key;
  activeSearchResults = null;
  document.querySelectorAll('.subnav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat === key);
  });
  const cat = CATEGORIES[key];
  if(cat){
    document.getElementById('page-title').textContent = cat.title;
    document.getElementById('page-sub').textContent = cat.sub;
    document.getElementById('sort').value = 'default';
    draw(cat.products);
  } else {
    document.getElementById('page-title').textContent = document.querySelector(`.subnav button[data-cat="${key}"]`).textContent;
    document.getElementById('page-sub').textContent = "Catégorie à venir.";
    draw([]);
  }
}

let activeSearchResults = null; // liste plate quand une recherche globale est active (toutes catégories)

function sortCards(mode){
  let list;
  if(activeSearchResults){
    list = [...activeSearchResults];
  } else {
    const cat = CATEGORIES[currentCategory];
    if(!cat) return;
    list = [...cat.products];
  }
  if(mode === 'price-asc'){
    list.sort((a,b)=> Math.min(...a.prices.map(x=>x.value)) - Math.min(...b.prices.map(x=>x.value)));
  } else if(mode === 'savings'){
    list.sort((a,b)=>{
      const sa = Math.max(...a.prices.map(x=>x.value)) - Math.min(...a.prices.map(x=>x.value));
      const sb = Math.max(...b.prices.map(x=>x.value)) - Math.min(...b.prices.map(x=>x.value));
      return sb - sa;
    });
  }
  draw(list);
}

draw(CATEGORIES[currentCategory].products);

// Ouverture directe sur une catégorie via lien (ex: dental-comparator.html?cat=anesthesie)
const params = new URLSearchParams(window.location.search);
const requestedCat = params.get('cat');
if(requestedCat){
  switchCategory(requestedCat);
}

// Recherche globale déclenchée depuis l'accueil (ex: dental-comparator.html?q=gants)
const requestedQuery = params.get('q');
if(requestedQuery){
  runGlobalSearch(requestedQuery);
}

function runGlobalSearch(query){
  const q = query.trim().toLowerCase();
  const headerInput = document.getElementById('site-search');
  if(headerInput) headerInput.value = query;

  document.querySelectorAll('.subnav button').forEach(b => b.classList.remove('active'));

  const allResults = [];
  for(const catKey in CATEGORIES){
    CATEGORIES[catKey].products.forEach(p => {
      const haystack = (p.name + ' ' + p.tag + ' ' + p.sub).toLowerCase();
      if(haystack.includes(q)){
        allResults.push(p);
      }
    });
  }

  document.getElementById('page-title').textContent = `Résultats pour « ${query} »`;
  document.getElementById('page-sub').textContent = allResults.length > 0
    ? `${allResults.length} référence(s) trouvée(s) sur les 6 catégories`
    : `Aucune référence trouvée — essayez un autre mot-clé`;
  document.getElementById('sort').value = 'default';
  activeSearchResults = allResults;
  draw(allResults);
}
</script>

</body>
</html>
